                    <div class="time">
                      <h class="box-menu" id="boxtime">Выбрать дату доставки</h>
                      <button type="button" name="popup-button" class="icon-btn">
                        <div class="going-image"></div>
                      </button>

                    <div class="adress">

                    </div>
                    <div class="wmodal" id="">
                      <div class="modal-overlay">
                        <div class="modal-window">
                          <div class="modal-header">
                            <span class="modal-title">Выберите дату доставки</span>
                            <span class="modal-close">&times;</span>
                          </div>
                          <div class="modal-body">
                            <div class="header-after">
                              <div class="header-after-left">Желаемое время доставки:</div>
                              <div class="header-after-right">Часовой пояс: Иркутск</div>
                            </div>
                            <div role="radiogroup" id="radiogroup" class="yes_radio">
                              <div class="time-variant">
                                <label role="radio" class="el-radio radio medium">
                                  <span class="el-radio_input" id="el_1">
                                    <input type="radio" name="question" class="yes">
                                  </span>
                                  <span class="el-radio_label">Как можно скорее</span>
                                </label>
                              </div>
                              <div class="time-variant">
                                <label role="radio" class="el-radio radio medium">
                                  <span class="el-radio_input" id="el_2">
                                    <input type="radio" name="question" class="yes" id="timet">
                                  </span>
                                  <span class="el-radio_label">Ко времени</span>
                                </label>
                              </div>
                              <div class="time-variant">
                                <label role="radio" class="el-radio radio medium">
                                  <span class="el-radio_input" id="el_3">
                                    <input type="radio" name="question" class="yes" id="accuracy">
                                  </span>
                                  <span class="el-radio_label" >Узнаем у получателя</span>
                                </label>
                              </div>
                            </div>
                              <div class="form-group" id="field_delivery">
                                <input id="datetimepicker" type="text" class="delivery" readonly="readonly" name="date"
                                placeholder="Дата и время доставки">
                              </div>
                              
                          </div>
                          <div class="modal-footer">
                            <button class="btn" id="btn_date">Сохранить</button>
                          </div>
                        </div>
